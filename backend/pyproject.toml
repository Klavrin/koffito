[project]
name = "koffito-backend"
version = "0.1.0"
description = "Koffito API: FastAPI in front of Supabase (auth-only for the app, RLS-scoped data access for users, service role for system jobs)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "slowapi>=0.1.9",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "cryptography>=43",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
